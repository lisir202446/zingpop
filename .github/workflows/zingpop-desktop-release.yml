name: Zingpop Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop semver, for example 1.14.20 or 1.14.20-beta.1"
        required: true
        type: string
      channel:
        description: "Update channel"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - beta
      keep_draft:
        description: "Keep the GitHub release as a draft after assets are uploaded"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  windows-installer:
    name: Build signed Windows installer
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      GH_TOKEN: ${{ github.token }}
      OPENCODE_CHANNEL: ${{ inputs.channel == 'beta' && 'beta' || 'prod' }}
      OPENCODE_VERSION: ${{ inputs.version }}
      ZINGPOP_DESKTOP_VERSION: ${{ inputs.version }}
      ZINGPOP_RELEASE_CHANNEL: ${{ inputs.channel }}
      ZINGPOP_REQUIRE_WINDOWS_SIGNING: "true"
      ZINGPOP_UPDATE_YML: ${{ inputs.channel == 'beta' && 'beta.yml' || 'latest.yml' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify signing secrets
        shell: pwsh
        run: |
          $missing = @()
          foreach ($name in @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "AZURE_TRUSTED_SIGNING_ENDPOINT",
            "AZURE_TRUSTED_SIGNING_ACCOUNT_NAME",
            "AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE"
          )) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing required GitHub secrets for Windows signing: $($missing -join ', ')"
          }

      - name: Azure login for Trusted Signing
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted

      - name: Set desktop package version
        shell: pwsh
        run: bun packages/desktop-electron/scripts/set-version.ts "$env:ZINGPOP_DESKTOP_VERSION"

      - name: Build desktop app
        working-directory: packages/desktop-electron
        run: bun run build

      - name: Create draft GitHub release
        shell: pwsh
        run: |
          $tag = "v$env:ZINGPOP_DESKTOP_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Use a new desktop version."
          }

          $releaseArgs = @(
            "release",
            "create",
            $tag,
            "--repo",
            $env:GITHUB_REPOSITORY,
            "--target",
            $env:GITHUB_SHA,
            "--title",
            "Zingpop Desktop $env:ZINGPOP_DESKTOP_VERSION",
            "--notes",
            "Signed Windows installer and auto-update metadata for Zingpop Desktop $env:ZINGPOP_DESKTOP_VERSION.",
            "--draft"
          )

          if ($env:ZINGPOP_RELEASE_CHANNEL -eq "beta") {
            $releaseArgs += "--prerelease"
          }

          gh @releaseArgs

          "ZINGPOP_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package, sign, and publish Windows installer
        working-directory: packages/desktop-electron
        run: npx electron-builder --win --x64 --publish always --config electron-builder.config.ts

      - name: Verify installer, signature, and update metadata
        shell: pwsh
        run: |
          $dist = "${{ github.workspace }}\packages\desktop-electron\dist"
          $installer = "$dist\zingpop-desktop-win-x64.exe"
          $blockmap = "$dist\zingpop-desktop-win-x64.exe.blockmap"
          $updateMetadata = "$dist\$env:ZINGPOP_UPDATE_YML"
          $app = "$dist\win-unpacked\Zingpop.exe"

          foreach ($path in @($installer, $blockmap, $updateMetadata, $app)) {
            if (-not (Test-Path $path)) {
              throw "Missing expected release output: $path"
            }
          }

          foreach ($path in @($installer, $app)) {
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $path`: $($signature.Status)"
            }
          }

      - name: Publish release
        if: ${{ inputs.keep_draft == false }}
        shell: pwsh
        run: |
          if ($env:ZINGPOP_RELEASE_CHANNEL -eq "beta") {
            gh release edit "$env:ZINGPOP_RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --draft=false --prerelease
          } else {
            gh release edit "$env:ZINGPOP_RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --draft=false --latest
          }

      - name: Upload CI package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zingpop-desktop-windows-release
          path: |
            packages/desktop-electron/dist/zingpop-desktop-win-x64.exe
            packages/desktop-electron/dist/zingpop-desktop-win-x64.exe.blockmap
            packages/desktop-electron/dist/*.yml
